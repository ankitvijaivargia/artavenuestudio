<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: 26px 30px; }
  .meta { font-size: 11px; letter-spacing: .06em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 14px; }
  .disp { font-family: var(--font-serif); font-weight: var(--weight-regular); font-size: 58px; line-height: var(--leading-display); letter-spacing: var(--tracking-tight); }
  .disp em { font-style: italic; color: var(--text-accent); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="meta">Cormorant Garamond · 400 / italic · display-1</div>
    <div class="disp">Crafted spaces,<br><em>collected stories.</em></div>
  </div>
</body>
</html>
