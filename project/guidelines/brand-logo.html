<!-- @dsCard group="Brand" viewport="700x230" name="Logo & monogram" subtitle="Wordmark lockup and AA monogram" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: 0; display: flex; min-height: 230px; }
  .pane { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .pane.dark { background: var(--surface-dark); color: var(--text-on-dark); }
  .pane.tint { background: var(--surface-stone); }

  /* Wordmark */
  .word { text-align: center; line-height: 1; }
  .word .name { font-family: var(--font-serif); font-weight: 500; font-size: 30px; letter-spacing: .16em; text-transform: uppercase; }
  .word .tag { font-family: var(--font-sans); font-weight: 400; font-size: 9.5px; letter-spacing: .42em; text-transform: uppercase; color: var(--text-muted); margin-top: 8px; }
  .dark .word .tag { color: var(--accent-soft); }

  /* Monogram */
  .mono { width: 64px; height: 64px; border: 1px solid currentColor; border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-size: 26px; letter-spacing: .04em; color: var(--accent-deep); border-color: var(--accent); }
  .dark .mono { color: var(--accent-soft); border-color: var(--accent-soft); }
  .cap { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
  .dark .cap { color: var(--text-on-dark-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="pane">
      <div class="word"><div class="name">Art Avenue</div><div class="tag">Design House · Est. India</div></div>
      <div class="cap">Primary wordmark</div>
    </div>
    <div class="pane tint">
      <div class="mono">AA</div>
      <div class="cap">Monogram</div>
    </div>
    <div class="pane dark">
      <div class="word"><div class="name">Art Avenue</div><div class="tag">Design House · Est. India</div></div>
      <div class="cap">On espresso</div>
    </div>
  </div>
</body>
</html>
