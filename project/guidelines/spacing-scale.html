<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base, generous luxury rhythm" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: 24px 30px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { text-align: center; }
  .bar { background: var(--accent-soft); width: 26px; border-radius: var(--radius-xs); }
  .n { font-size: 11px; color: var(--text-secondary); margin-top: 8px; letter-spacing: .03em; }
  .v { font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="item"><div class="bar" style="height:8px"></div><div class="n">2xs</div><div class="v">8</div></div>
      <div class="item"><div class="bar" style="height:12px"></div><div class="n">xs</div><div class="v">12</div></div>
      <div class="item"><div class="bar" style="height:16px"></div><div class="n">sm</div><div class="v">16</div></div>
      <div class="item"><div class="bar" style="height:24px"></div><div class="n">md</div><div class="v">24</div></div>
      <div class="item"><div class="bar" style="height:32px"></div><div class="n">lg</div><div class="v">32</div></div>
      <div class="item"><div class="bar" style="height:48px"></div><div class="n">xl</div><div class="v">48</div></div>
      <div class="item"><div class="bar" style="height:64px"></div><div class="n">2xl</div><div class="v">64</div></div>
      <div class="item"><div class="bar" style="height:88px"></div><div class="n">3xl</div><div class="v">96</div></div>
    </div>
  </div>
</body>
</html>
