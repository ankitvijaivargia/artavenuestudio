<!-- @dsCard group="Type" viewport="700x150" name="Eyebrow & captions" subtitle="Letterspaced uppercase labels" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: 26px 30px; display: flex; gap: 48px; align-items: center; }
  .col { display: grid; gap: 14px; }
  .eyebrow { font-size: 12px; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-accent); }
  .eyebrow-ink { font-size: 12px; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-muted); }
  .cap { font-family: var(--font-serif); font-style: italic; font-size: 17px; color: var(--text-muted); }
  .rule { display: inline-flex; align-items: center; gap: 12px; font-size: 12px; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-accent); }
  .rule::before { content: ""; width: 32px; height: 1px; background: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col">
      <div class="eyebrow">New Arrivals</div>
      <div class="eyebrow-ink">Handcrafted in India</div>
      <div class="rule">The Atelier</div>
    </div>
    <div class="col">
      <div class="cap">Fig. 01 — Hand-knotted wool, natural dye</div>
      <div class="cap">A study in stone &amp; brass</div>
    </div>
  </div>
</body>
</html>
