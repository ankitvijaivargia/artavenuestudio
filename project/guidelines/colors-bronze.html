<!-- @dsCard group="Colors" viewport="700x190" name="Bronze accent" subtitle="The single accent — used sparingly" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: 22px 26px; }
  .row { display: flex; gap: 14px; align-items: flex-start; }
  .sw { flex: 1; }
  .chip { height: 76px; border-radius: var(--radius-xs); border: 1px solid var(--border-hairline); }
  .name { font-size: 12px; letter-spacing: .04em; margin-top: 10px; color: var(--text-secondary); }
  .hex { font-size: 11px; color: var(--text-muted); margin-top: 2px; letter-spacing: .03em; }
  .demo { flex: 1.3; padding-left: 8px; }
  .eyebrow { font-size: 12px; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-accent); }
  .rule { height: 1px; width: 44px; background: var(--accent); margin: 12px 0; }
  .ser { font-family: var(--font-serif); font-size: 26px; color: var(--text-primary); line-height: 1.1; }
  .ser em { color: var(--text-accent); font-style: italic; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--aa-bronze-tint)"></div><div class="name">bronze-tint</div><div class="hex">#ECE1CE</div></div>
      <div class="sw"><div class="chip" style="background:var(--aa-bronze-soft)"></div><div class="name">bronze-soft</div><div class="hex">#B89A6E</div></div>
      <div class="sw"><div class="chip" style="background:var(--aa-bronze)"></div><div class="name">bronze · accent</div><div class="hex">#9C7C4E</div></div>
      <div class="sw"><div class="chip" style="background:var(--aa-bronze-deep)"></div><div class="name">bronze-deep</div><div class="hex">#7B6038</div></div>
      <div class="demo">
        <div class="eyebrow">Signature Collection</div>
        <div class="rule"></div>
        <div class="ser">Crafted spaces,<br><em>collected stories.</em></div>
      </div>
    </div>
  </div>
</body>
</html>
