<!-- @dsCard group="Type" viewport="700x230" name="Heading scale" subtitle="H1–H4 serif hierarchy" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: 24px 30px; display: grid; gap: 14px; }
  .line { display: flex; align-items: baseline; gap: 18px; border-bottom: 1px solid var(--border-hairline); padding-bottom: 12px; }
  .line:last-child { border-bottom: 0; }
  .tag { font-size: 11px; letter-spacing: .06em; color: var(--text-muted); width: 96px; flex: none; text-transform: uppercase; }
  .h1 { font-family: var(--font-serif); font-weight: 500; font-size: 40px; line-height: 1.1; letter-spacing: -.01em; }
  .h2 { font-family: var(--font-serif); font-weight: 500; font-size: 30px; line-height: 1.15; }
  .h3 { font-family: var(--font-serif); font-weight: 500; font-size: 22px; }
  .h4 { font-family: var(--font-sans); font-weight: 500; font-size: 16px; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="line"><span class="tag">H1 · serif 500</span><span class="h1">Signature Collections</span></div>
    <div class="line"><span class="tag">H2 · serif 500</span><span class="h2">The Craftsmanship Story</span></div>
    <div class="line"><span class="tag">H3 · serif 500</span><span class="h3">Shop by Room</span></div>
    <div class="line"><span class="tag">H4 · sans 500</span><span class="h4">Materials &amp; Finish</span></div>
  </div>
</body>
</html>
