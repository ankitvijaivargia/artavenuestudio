<!-- @dsCard group="Colors" viewport="700x180" name="Dark surface" subtitle="Espresso contrast sections & footer" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .wrap { padding: 0; display: flex; }
  .panel { flex: 1.4; background: var(--surface-dark); color: var(--text-on-dark); padding: 26px 28px; min-height: 158px; box-sizing: border-box; }
  .eyebrow { font-size: 12px; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--accent-soft); }
  .ser { font-family: var(--font-serif); font-size: 30px; line-height: 1.1; margin-top: 12px; }
  .sub { color: var(--text-on-dark-muted); font-size: 13px; margin-top: 10px; }
  .chips { flex: 1; display: flex; flex-direction: column; }
  .chip { flex: 1; display: flex; align-items: flex-end; padding: 8px 12px; font-size: 11px; letter-spacing: .03em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="eyebrow">Trade &amp; Design</div>
      <div class="ser">A house, not a store.</div>
      <div class="sub">Espresso #221F1B grounds quiet, high-contrast moments.</div>
    </div>
    <div class="chips">
      <div class="chip" style="background:var(--aa-espresso); color:#B7AE9E">espresso · #221F1B</div>
      <div class="chip" style="background:var(--aa-espresso-soft); color:#C9C0B0">espresso-soft · #36322B</div>
    </div>
  </div>
</body>
</html>
