<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: 26px 30px; }
  .row { display: flex; gap: 30px; align-items: center; color: var(--text-primary); }
  .row i { font-size: 30px; }
  .meta { margin-top: 20px; font-size: 12px; color: var(--text-muted); letter-spacing: .03em; }
  .meta b { color: var(--text-secondary); font-weight: 500; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <i class="ph-light ph-magnifying-glass"></i>
      <i class="ph-light ph-handbag-simple"></i>
      <i class="ph-light ph-heart"></i>
      <i class="ph-light ph-user"></i>
      <i class="ph-light ph-truck"></i>
      <i class="ph-light ph-ruler"></i>
      <i class="ph-light ph-leaf"></i>
      <i class="ph-light ph-armchair"></i>
      <i class="ph-light ph-sparkle"></i>
      <i class="ph-light ph-arrow-right"></i>
    </div>
    <div class="meta"><b>Phosphor Icons · Light weight.</b> Thin, quiet, never colored. Reserve for navigation, utility &amp; trust cues — never decoration.</div>
  </div>
</body>
</html>
