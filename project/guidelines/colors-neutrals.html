<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals — warm greige" subtitle="Ivory canvas through deep sand" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); }
  .wrap { padding: 22px 26px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 76px; border-radius: var(--radius-xs); border: 1px solid var(--border-hairline); }
  .name { font-size: 12px; letter-spacing: .04em; margin-top: 10px; color: var(--text-secondary); }
  .hex { font-size: 11px; color: var(--text-muted); margin-top: 2px; letter-spacing: .03em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--aa-warm-white)"></div><div class="name">warm-white</div><div class="hex">#FCFAF6</div></div>
      <div class="sw"><div class="chip" style="background:var(--aa-ivory)"></div><div class="name">ivory · page</div><div class="hex">#FAF6EF</div></div>
      <div class="sw"><div class="chip" style="background:var(--aa-canvas)"></div><div class="name">canvas · alt</div><div class="hex">#F4EEE3</div></div>
      <div class="sw"><div class="chip" style="background:var(--aa-stone)"></div><div class="name">stone</div><div class="hex">#EAE1D3</div></div>
      <div class="sw"><div class="chip" style="background:var(--aa-sand)"></div><div class="name">sand</div><div class="hex">#DCD1BD</div></div>
      <div class="sw"><div class="chip" style="background:var(--aa-clay)"></div><div class="name">clay</div><div class="hex">#C9BCA4</div></div>
    </div>
  </div>
</body>
</html>
